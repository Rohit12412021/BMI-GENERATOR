<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bmi GENRATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-box">
       <div class="font-showing-box">
        <h1 class="top-heading">BMI CALCULATOR</h1>
       </div>
    </header>
    <main>
        <div class="input-box-container">
         
            <div class="rr" style="color:white">Height (Meter) <input type="number" id="height" placeholder="Enter your height" class="gg" id="ggr"></div>
<br> 
              
<div class="rr" style="color:white">Weight (KiloGram) <input type="number" id="weight" placeholder="Enter your weight" class="gg" ></div>
             <br><br><br>
<button  id="btn">
    Calculate
</button>
        </div>
    </main>
    <footer>
        <div class="msg-container">
            <div class="msg-screen">
                <div class="top-heading-msg-screen">BMI categories</div>
                <br>
                <div class="underweight">Below 18.5 → Underweight</div>

<div class="normal">18.5 - 24.9 → Normal Weight</div>

<div class="overweight">25 - 29.9 → Overweight</div>

<div class="obesity1">30 - 34.9 → Obesity Class I</div>

<div class="obesity2">35 - 39.9 → Obesity Class II</div>

<div class="obesity3">40 and above → Obesity Class III</div>
            </div>
        </div>

    </footer>
    <script src="script.js"></script>
</body>
</html>
